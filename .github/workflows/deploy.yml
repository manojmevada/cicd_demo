name: Deploy Node App to OCI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Deploy to OCI VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            # Navigate to project directory or clone if doesn't exist
            if [ ! -d "/home/ubuntu/cicd_demo" ]; then
              echo "Cloning repository for the first time..."
              cd /home/ubuntu
              git clone https://github.com/manojmevada/cicd_demo.git
            fi
            
            cd /home/ubuntu/cicd_demo
            
            # Pull latest changes
            echo "Pulling latest changes..."
            git pull origin main
            
            # Stop existing containers
            echo "Stopping existing containers..."
            docker compose down || true
            
            # Remove old images to free space
            echo "Cleaning up old images..."
            docker image prune -f
            
            # Build and start new containers
            echo "Building and starting containers..."
            docker compose up -d --build
            
            # Show running containers
            echo "Deployment complete! Running containers:"
            docker compose ps
            
            # Show logs
            echo "Recent logs:"
            docker compose logs --tail=20
            
      - name: Verify deployment
        run: |
          echo "Waiting for application to start..."
          sleep 10
          echo "Testing application endpoint..."
          curl -f http://${{ secrets.OCI_HOST }}/ || echo "Note: Verify deployment manually at http://${{ secrets.OCI_HOST }}/"


